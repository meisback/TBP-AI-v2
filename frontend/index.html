<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBP AI v3.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h1>🤖 TBP AI</h1>
        <p>Login to Continue</p>
        <input type="text" id="username" placeholder="Enter your name">
        <button id="loginBtn">Continue</button>
    </div>
</div>

<div class="app">

    <header>
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <div>
                <h2>TBP AI v3.0</h2>
                <span>Official AI Assistant</span>
            </div>
        </div>

        <div class="header-buttons">
            <button id="newChatBtn" title="New Chat">+</button>
            <button id="themeBtn" title="Toggle Theme">🌙</button>
            <button id="wallpaperBtn" title="Choose Wallpaper">🖼️</button>
            <button id="profileBtn" title="Profile">👤</button>
            <button id="logoutBtn" title="Logout">🚪</button>
        </div>
    </header>

    <main id="chatBox">
        <div class="message bot">
            <div class="bubble">
                👋 <b>স্বাগতম!</b><br><br>
                আমি <b>TBP AI v3.0</b>।<br><br>
                বাংলা, English অথবা Hinglish-এ যেকোনো প্রশ্ন করতে পারেন। 🚀
            </div>
        </div>
    </main>

    <div id="typing">TBP AI লিখছে... ✍️</div>

    <footer>
        <button id="attachBtn" title="Attach File">📎</button>

        <input
            id="userInput"
            type="text"
            placeholder="Message TBP AI..."
            autocomplete="off"
        >

        <button id="voiceBtn" title="Voice Input">🎤</button>
        
        <button id="sendBtn" title="Send">
            ➤
        </button>
    </footer>

</div>

<div id="wallpaperPanel" class="overlay">
    <div class="settings-panel">
        <h2>🖼️ Choose Wallpaper</h2>
        
        <div class="wallpaper-grid">
            <div class="wallpaper" data-wall="wallpapers/wall1.jpg" style="background-image:url('wallpapers/wall1.jpg')"></div>
            <div class="wallpaper" data-wall="wallpapers/wall2.jpg" style="background-image:url('wallpapers/wall2.jpg')"></div>
            <div class="wallpaper" data-wall="wallpapers/wall3.jpg" style="background-image:url('wallpapers/wall3.jpg')"></div>
            <div class="wallpaper" data-wall="wallpapers/wall4.jpg" style="background-image:url('wallpapers/wall4.jpg')"></div>
            <div class="wallpaper" data-wall="wallpapers/wall5.jpg" style="background-image:url('wallpapers/wall5.jpg')"></div>
            <div class="wallpaper" data-wall="wallpapers/wall6.jpg" style="background-image:url('wallpapers/wall6.jpg')"></div>
        </div>

        <button id="closeWallpaper" class="close-panel">Close</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
