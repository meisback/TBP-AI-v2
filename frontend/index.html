<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBP AI v3.0</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-screen">

    <div class="login-card">

        <div class="login-logo">
            🤖
        </div>

        <h1>TBP AI v3.0</h1>

        <p>Welcome Back</p>

        <input
            type="text"
            id="username"
            placeholder="Enter your name"
            autocomplete="off">

        <button id="loginBtn">
            Continue
        </button>

    </div>

</div>

<!-- Main App -->
<div class="app">

    <!-- Header -->
    <header class="header">

    <div class="header-left">

        <div class="ai-logo">
            🤖
        </div>

        <div class="header-title">

            <h2>TBP AI v3.0</h2>

            <span>Professional AI Assistant</span>

        </div>

    </div>

    <div class="header-right">

        <button id="newChatBtn" class="top-btn">+</button>

        <button id="themeBtn" class="top-btn">🌙</button>

        <button id="wallpaperBtn" class="top-btn">🖼️</button>

        <button id="profileBtn" class="top-btn">👤</button>

        <button id="logoutBtn" class="top-btn">🚪</button>

    </div>

            </header>

    <!-- Chat Area -->

    <main id="chatBox" class="chat-box">

        <div class="bot message">

            <div class="bubble">

                👋 <b>স্বাগতম!</b>

                <br><br>

                আমি <b>TBP AI v3.0</b>

                <br><br>

                আপনার যেকোনো প্রশ্ন করতে পারেন।

            </div>

        </div>
        </main>

  <!-- Typing Indicator -->
  <div id="typing" class="typing" style="display:none;">
    <div class="typing-bubble">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- Input Area -->
  <footer class="input-area">

    <button id="attachBtn" class="icon-btn" title="Attach File">
      📎
    </button>

    <textarea
      id="userInput"
      placeholder="Message TBP AI..."
      rows="1"
    ></textarea>

    <button id="voiceBtn" class="icon-btn" title="Voice">
      🎤
    </button>

    <button id="sendBtn" class="send-btn" title="Send">
      ➤
    </button>

  </footer>

</div>

<!-- Wallpaper Panel -->

<div id="wallpaperPanel" class="modal">

  <div class="modal-content">

    <h2>🖼️ Choose Wallpaper</h2>

    <div class="wallpaper-grid">

      <div class="wallpaper" data-wall="wallpapers/wall1.jpg"></div>

      <div class="wallpaper" data-wall="wallpapers/wall2.jpg"></div>

      <div class="wallpaper" data-wall="wallpapers/wall3.jpg"></div>

      <div class="wallpaper" data-wall="wallpapers/wall4.jpg"></div>

      <div class="wallpaper" data-wall="wallpapers/wall5.jpg"></div>

      <div class="wallpaper" data-wall="wallpapers/wall6.jpg"></div>

    </div>

    <button id="closeWallpaper" class="close-btn">

      Close

    </button>

  </div>

</div>
<!-- Settings Panel -->
<div id="settingsPanel" class="modal">

  <div class="modal-content">

    <h2>⚙️ Settings</h2>

    <div class="setting-item">
      <span>🌙 Theme</span>
      <button id="themeSwitchBtn" class="setting-btn">Toggle</button>
    </div>

    <div class="setting-item">
      <span>🖼️ Wallpaper</span>
      <button id="openWallpaperBtn" class="setting-btn">Open</button>
    </div>

    <div class="setting-item">
      <span>🗑️ Clear Chat</span>
      <button id="clearChatBtn" class="setting-btn">Clear</button>
    </div>

    <button id="closeSettings" class="close-btn">
      Close
    </button>

  </div>

</div>

<!-- Profile Panel -->
<div id="profilePanel" class="modal">

  <div class="modal-content">

    <div class="profile-avatar">
      👤
    </div>

    <h2 id="profileName">
      Guest
    </h2>

    <p>
      TBP AI v3.0 Pro User
    </p>

    <button id="logoutBtn" class="close-btn">
      Logout
    </button>

    <button id="closeProfile" class="close-btn">
      Close
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
    </html>
