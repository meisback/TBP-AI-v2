ü<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TBP AI v2.0</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- Login Screen -->
<div id="loginScreen">

    <div class="login-box">

        <h1>🤖 TBP AI</h1>

        <p>Login to Continue</p>

        <input
            type="text"
            id="username"
            placeholder="Enter your name"
        >

        <button id="loginBtn">
            Continue
        </button>

    </div>

</div>

<div class="app">

    <!-- Header -->
    <header class="header">

    <div class="header-left">

        <button id="menuBtn" class="icon-btn">☰</button>

        <div class="logo-box">

            <div class="logo-icon">🤖</div>

            <div>

                <h2>TBP AI v2.1</h2>

                <span class="status">
                    🟢 Online
                </span>

            </div>

        </div>

    </div>

    <div class="header-right">

        <button id="searchBtn" class="icon-btn">🔍</button>

        <button id="wallpaperBtn" class="icon-btn">🖼️</button>

        <button id="themeBtn" class="icon-btn">🌙</button>

        <button id="profileBtn" class="icon-btn">👤</button>

    </div>

    </header>

    <!-- Chat Box -->

    <main id="chatBox">

        <div class="bot message">

            <div class="bubble">

                👋 <b>স্বাগতম!</b><br><br>

                আমি <b>TBP AI v2.0</b>।

                <br><br>

                বাংলা, English অথবা Hinglish-এ প্রশ্ন করতে পারেন।

            </div>

        </div>
        </main>

    <!-- Typing Indicator -->
    <div id="typing" class="typing" style="display:none;">
        TBP AI লিখছে...
    </div>

    <!-- Input -->
<footer>

    <button id="attachBtn" title="Attach File">
        📎
    </button>

    <input
        id="userInput"
        type="text"
        placeholder="Message TBP AI..."
        autocomplete="off"
    >

    <button id="voiceBtn" title="Voice">
        🎤
    </button>

    <button id="sendBtn" title="Send">
        ➤
    </button>

</footer>
</div>

<script src="script.js"></script>

</body>
</html>
