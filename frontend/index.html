<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TBP AI v3.1</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Login -->

<div id="loginScreen" class="login-screen">

    <div class="login-card">

        <div class="login-logo">🤖</div>

        <h1>TBP AI</h1>

        <p>Professional AI Assistant</p>

        <input
            type="text"
            id="username"
            placeholder="Enter your name">

        <button id="loginBtn">
            Continue
        </button>

    </div>

</div>

<!-- Main App -->

<div class="app">

<header class="header">

<div class="header-left">

<div class="ai-logo">
🤖
</div>

<div class="header-title">

<h2>TBP AI v3.1</h2>

<span>Professional AI Assistant</span>

</div>

</div>

<div class="header-right">

<button
class="top-btn"
id="newChatBtn">
+
</button>

<button
class="top-btn"
id="themeBtn">
🌙
</button>

<button
class="top-btn"
id="wallpaperBtn">
🖼️
</button>

<button
class="top-btn"
id="settingsBtn">
⚙️
</button>

<button
class="top-btn"
id="profileBtn">
👤
</button>

<button
class="top-btn"
id="logoutBtn">
🚪
</button>

</div>

</header>

<main
id="chatBox"
class="chat-box">

</main>

<div
id="typing"
class="typing"
style="display:none;">

<div class="typing-bubble">

<span></span>
<span></span>
<span></span>

</div>

</div>
<!-- Input Area -->

<footer class="input-area">

    <button
        id="attachBtn"
        class="icon-btn">
        📎
    </button>

    <textarea
        id="userInput"
        placeholder="Message TBP AI..."
        rows="1"></textarea>

    <button
        id="voiceBtn"
        class="icon-btn">
        🎤
    </button>

    <button
        id="sendBtn"
        class="send-btn">
        ➤
    </button>

</footer>

</div>

<!-- Wallpaper Modal -->

<div id="wallpaperPanel" class="modal">

    <div class="modal-content">

        <h2>🖼️ Choose Wallpaper</h2>

        <div class="wallpaper-grid">

            <div class="wallpaper" data-wall="wallpapers/wall1.jpg"></div>
            <div class="wallpaper" data-wall="wallpapers/wall2.jpg"></div>
            <div class="wallpaper" data-wall="wallpapers/wall3.jpg"></div>
            <div class="wallpaper" data-wall="wallpapers/wall4.jpg"></div>
            <div class="wallpaper" data-wall="wallpapers/wall5.jpg"></div>
            <div class="wallpaper" data-wall="wallpapers/wall6.jpg"></div>

        </div>

        <br>

        <button
            id="closeWallpaper"
            class="close-btn">
            Close
        </button>

    </div>

</div>

<!-- Settings Modal -->

<div id="settingsPanel" class="modal">

    <div class="modal-content">

        <h2>⚙️ Settings</h2>

        <div class="setting-item">

            <span>Wallpaper</span>

            <button
                id="openWallpaperBtn"
                class="setting-btn">
                Open
            </button>

        </div>

        <div class="setting-item">

            <span>Clear Chat</span>

            <button
                id="clearChatBtn"
                class="setting-btn">
                Clear
            </button>

        </div>

        <br>

        <button
            id="closeSettings"
            class="close-btn">
            Close
        </button>

    </div>

</div>
<!-- Profile Modal -->

<div id="profilePanel" class="modal">

    <div class="modal-content">

        <div class="profile-avatar">
            👤
        </div>

        <h2 id="profileName">
            Guest
        </h2>

        <p>
            Welcome to TBP AI v3.1 Professional
        </p>

        <button
            id="closeProfile"
            class="close-btn">
            Close
        </button>

    </div>

</div>

<!-- JavaScript -->

<script src="script.js"></script>

</body>
</html>
